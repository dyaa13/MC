<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DYAA Canta Math</title>
<style>
:root{
  --blue:#0d47a1; --blue2:#1976d2; --orange:#ff9800; --green:#4caf50;
  --purple:#9c27b0; --red:#c62828; --bg:#f4f4f9;
}
*{box-sizing:border-box}
body{font-family:"Segoe UI",Tahoma,sans-serif;background:var(--bg);margin:0;padding:20px;color:#333}
.quiz-container{max-width:980px;margin:34px auto;background:#fff;padding:30px;border-radius:14px;box-shadow:0 6px 15px rgba(0,0,0,.1)}
.dyaa-header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px;border-bottom:3px solid var(--blue);padding-bottom:12px}
.dyaa-brand{display:flex;align-items:center;gap:14px}
.dyaa-logo-mark{width:54px;height:54px;border-radius:12px;background:linear-gradient(135deg,#0d47a1 0%,#1976d2 62%,#ff9800 63%,#ff9800 100%);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1.15em;box-shadow:0 3px 8px rgba(0,0,0,.16)}
.dyaa-title{font-weight:900;font-size:1.45em;color:var(--blue);line-height:1.05}
.dyaa-subtitle{margin-top:4px;font-size:.9em;color:var(--orange);font-weight:800;letter-spacing:.8px;text-transform:uppercase}
.dyaa-mode-tag{font-size:.9em;font-weight:800;color:var(--blue);background:#eaf3ff;border:1px solid #cfe2ff;padding:8px 12px;border-radius:999px;white-space:nowrap}
h1{margin:0 0 18px;font-size:1.9em;font-weight:800}
.start-card{background:#fafafa;border:1px solid #eceff3;border-radius:12px;padding:18px}
.select-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.field label{display:block;font-weight:800;margin-bottom:6px}
.field select,.field input{width:100%;padding:11px 12px;border:1px solid #ccc;border-radius:8px;font-size:1em;background:#fff}
.mode-row{margin-top:16px;display:flex;gap:14px;flex-wrap:wrap}
.mode-pill{display:inline-flex;gap:8px;align-items:center;padding:9px 13px;border:1px solid #ddd;border-radius:999px;background:#fff;cursor:pointer;user-select:none}
.rule-box{background:#fff8e1;border-left:4px solid var(--orange);border-radius:8px;padding:12px 14px;line-height:1.55;margin:16px 0}
.start-row{margin-top:16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.start-row button{padding:12px 22px;border-radius:8px;border:none;background:var(--green);color:#fff;font-size:1.05em;cursor:pointer;font-weight:800}
.status{background:#eef5ff;border:1px solid #cfe2ff;border-radius:8px;padding:10px 12px;color:var(--blue);font-weight:800;margin-top:12px}
.quiz-main{display:flex;gap:20px;margin-top:10px}
.sidebar{width:170px;border-right:1px solid #ddd;padding-right:10px;display:none}
.sidebar h4{margin:0 0 8px;font-size:.95em;border-bottom:1px solid #eee;padding-bottom:4px}
.sidebar ul{list-style:none;padding:0;margin:0}
.sidebar li{padding:6px;cursor:pointer;border-radius:4px;font-size:.9em;user-select:none;margin-bottom:2px}
.sidebar li.active{background:#bbdefb;font-weight:600}
.sidebar li.correct-li{border-left:4px solid var(--green)}
.sidebar li.incorrect-li{border-left:4px solid #f44336}
#quizContent{flex:1;min-width:0}
.quiz-topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.question-text{font-size:1.1em;margin:0;font-weight:800}
.timer-controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.timer,.penalty-chip,.total-chip{font-weight:900;padding:6px 10px;border-radius:8px;white-space:nowrap}
.timer{background:#f2f6ff;border:1px solid #d6e4ff}
.penalty-chip{background:#fff2f2;border:1px solid #ffcdd2;color:var(--red)}
.total-chip{background:#edf9ef;border:1px solid #c8e6c9;color:#2e7d32}
.pause-btn{padding:7px 13px;border-radius:7px;border:none;color:#fff;cursor:pointer;font-weight:800;background:var(--orange)}
.pause-btn.resume{background:var(--green)}
.paused-cover{margin-top:10px;padding:10px 12px;border-radius:8px;background:#fff3cd;border:1px solid #ffe08a;color:#7a5200;font-weight:800}
.qbox{background:#fafafa;border:1px solid #eee;border-radius:10px;padding:14px;min-height:270px;display:flex;align-items:center;justify-content:center}
.question-image{display:block;max-width:100%;max-height:610px;width:auto;height:auto;object-fit:contain;margin:0 auto;border-radius:8px}
.answer-box{width:360px;padding:10px;font-size:1.05em;border:1px solid #ccc;border-radius:8px;outline:none;margin-top:10px}
.answer-box:focus{border-color:#5ba8ff;box-shadow:0 0 0 3px rgba(91,168,255,.2)}
.answer-box[disabled]{background:#f6f7f9;color:#666}
.button-row{margin-top:18px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.btn-prev,.btn-next,.btn-check{padding:10px 18px;border:none;border-radius:6px;color:#fff;cursor:pointer;font-size:1em;white-space:nowrap}
.btn-prev{background:#03a9f4}.btn-next{background:var(--green)}.btn-check{background:var(--purple)}
button:disabled{opacity:.55!important;cursor:not-allowed!important}
#checkResult{margin-top:10px;min-height:22px;font-weight:900}
.small-note{color:#666;font-size:.9em;margin-top:8px}
.review-table{width:100%;border-collapse:collapse;margin-top:18px}
.review-table th,.review-table td{border:1px solid #ccc;padding:8px;font-size:.9em}
.review-table th{background:#f2f2f2}.correct-answer{background:#d4edda}.incorrect-answer{background:#f8d7da}
.summary-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:16px 0}
.summary-card{border:1px solid #ddd;background:#fafafa;border-radius:10px;padding:12px}
.summary-card .k{color:#666;font-size:.78em;font-weight:800;text-transform:uppercase}
.summary-card .v{margin-top:4px;font-size:1.2em;font-weight:900;color:var(--blue)}
.action-btns{margin-top:14px}
.action-btns button{padding:10px 18px;border-radius:6px;border:none;color:#fff;cursor:pointer;font-size:.95em;margin-right:10px;background:#607d8b}
@media(max-width:760px){
  body{padding:8px}.quiz-container{margin:10px auto;padding:16px}.quiz-main{flex-direction:column}
  .sidebar{width:100%;border-right:none;border-bottom:1px solid #ddd;padding-right:0;padding-bottom:10px;margin-bottom:10px}
  .answer-box{width:100%}.summary-grid{grid-template-columns:1fr 1fr}.select-grid{grid-template-columns:1fr}.dyaa-mode-tag{display:none}
}
</style>
</head>
<body>
<div class="quiz-container">
  <div class="dyaa-header">
    <div class="dyaa-brand">
      <div class="dyaa-logo-mark">DYAA</div>
      <div>
        <div class="dyaa-title">DYAA Education NZ</div>
        <div class="dyaa-subtitle">Canta Math</div>
      </div>
    </div>
    <div class="dyaa-mode-tag">Exercise Mode / Run Mode</div>
  </div>

  <h1 id="pageTitle">DYAA Canta Math</h1>
  <div class="quiz-main">
    <div id="sidebar" class="sidebar"></div>
    <div id="quizContent"></div>
  </div>
</div>

<script src="catalog.js"></script>
<script>
const DEFAULT_RUN_SECONDS=30;
const CATALOG=window.CANTAMATH_CATALOG||[];

let selectedSet=null;
let bankQuestions=null;
let bankAnswers=null;
let loadedScripts=new Set();

let questions=[],userAnswers=[],selectedMode="exercise",studentName="",runSeconds=DEFAULT_RUN_SECONDS;
let currentQuestionIndex=0,solved=[],attempts=[],unlocked=0,wrongAttempts=0,penaltyRuns=0;
let quizStartTime=null,quizEndTime=null,paused=false,pauseStart=null,totalPausedMs=0,timerId=null;
let activeQuestionIndex=null,questionStartTime=null,questionPauseStart=null,questionPausedMs=0,questionStats=[];
let finalResults=null;

const quizContent=document.getElementById("quizContent");
const sidebarEl=document.getElementById("sidebar");

function loadClassicScript(src){
  return new Promise((resolve,reject)=>{
    if(loadedScripts.has(src)){resolve();return}
    const s=document.createElement("script");
    s.src=src;
    s.onload=()=>{loadedScripts.add(src);resolve()};
    s.onerror=()=>reject(new Error("Could not load "+src));
    document.head.appendChild(s);
  });
}

function normalizeGradeDisplay(g){return String(g||"").replace(/^Y/i,"Year ")}
function availableYears(){return [...new Set(CATALOG.map(x=>Number(x.year)))].sort((a,b)=>b-a)}
function setsForYear(year){return CATALOG.filter(x=>String(x.year)===String(year))}

function showStartScreen(){
  stopTimer();sidebarEl.style.display="none";selectedSet=null;bankQuestions=null;bankAnswers=null;
  document.getElementById("pageTitle").textContent="DYAA Canta Math";

  if(!CATALOG.length){
    quizContent.innerHTML=`<div class="status">No papers found in catalog.js.</div>`;
    return;
  }

  const years=availableYears();
  quizContent.innerHTML=`
    <div class="start-card">
      <p>Select the paper, then choose Exercise Mode or Run Mode.</p>

      <div class="select-grid">
        <div class="field"><label for="yearSelect">Year</label><select id="yearSelect"></select></div>
        <div class="field"><label for="gradeSelect">Grade</label><select id="gradeSelect"></select></div>
      </div>

      <div class="mode-row">
        <label class="mode-pill"><input type="radio" name="mode" value="exercise" checked> Exercise Mode</label>
        <label class="mode-pill"><input type="radio" name="mode" value="run"> Run Mode</label>
      </div>

      <div class="rule-box">
        <strong>Both modes are timed.</strong><br>
        Every incorrect answer adds <strong>1 Run Penalty</strong>.<br>
        Default Run Time = <strong>30 seconds</strong>.<br>
        <strong>Final Score Time = Actual Time + Run Penalties × Run Time.</strong><br><br>
        <strong>Exercise Mode:</strong> students can move freely between questions.<br>
        <strong>Run Mode:</strong> starts at Question 1 and moves forward only after a correct answer.
        A wrong answer stays on the same question and adds one Run Penalty.
      </div>

      <div class="select-grid">
        <div class="field"><label for="runSecondsInput">Run Time (seconds)</label><input id="runSecondsInput" type="number" min="1" step="1" value="${DEFAULT_RUN_SECONDS}"></div>
        <div class="field"><label for="nameInput">Student Name</label><input id="nameInput" type="text" placeholder="Student name"></div>
      </div>

      <div class="start-row"><button id="startBtn">Start</button></div>
      <div id="status" class="status" style="display:none;"></div>
    </div>`;

  const yearSelect=document.getElementById("yearSelect");
  years.forEach(y=>{
    const o=document.createElement("option");o.value=y;o.textContent=y;yearSelect.appendChild(o);
  });

  function refreshGrades(){
    const gradeSelect=document.getElementById("gradeSelect");
    gradeSelect.innerHTML="";
    setsForYear(yearSelect.value).forEach(s=>{
      const o=document.createElement("option");
      o.value=s.key;o.textContent=s.label||normalizeGradeDisplay(s.grade);gradeSelect.appendChild(o);
    });
  }
  yearSelect.value=years[0];refreshGrades();yearSelect.onchange=refreshGrades;
  document.getElementById("startBtn").onclick=loadSelectedPaper;
}

async function loadSelectedPaper(){
  const key=document.getElementById("gradeSelect").value;
  selectedSet=CATALOG.find(x=>x.key===key);
  if(!selectedSet)return;

  const mode=document.querySelector('input[name="mode"]:checked');
  selectedMode=mode?mode.value:"exercise";
  studentName=(document.getElementById("nameInput").value||"Student").trim()||"Student";
  const r=Number(document.getElementById("runSecondsInput").value);
  runSeconds=Number.isFinite(r)&&r>0?Math.round(r):DEFAULT_RUN_SECONDS;

  const status=document.getElementById("status");
  status.style.display="block";
  status.style.color="#0d47a1";
  status.textContent=`Loading ${selectedSet.year} ${selectedSet.label||normalizeGradeDisplay(selectedSet.grade)}...`;

  try{
    await Promise.all([
      loadClassicScript(selectedSet.questionsScript),
      loadClassicScript(selectedSet.answersScript)
    ]);

    bankQuestions=window[`CANTAMATH_${selectedSet.key}_QUESTIONS`];
    bankAnswers=window[`CANTAMATH_${selectedSet.key}_ANSWERS`];

    if(!Array.isArray(bankQuestions)||!Array.isArray(bankAnswers)||bankQuestions.length!==bankAnswers.length){
      throw new Error("Question bank and answer bank do not match.");
    }

    status.style.color="#2e7d32";
    status.textContent=`Loaded ${bankQuestions.length} questions.`;
    setTimeout(startQuiz,180);
  }catch(err){
    status.style.color="#c62828";
    status.textContent=`Load failed: ${err.message}`;
  }
}

function parseNumeric(raw){
  let s=String(raw||"").trim().replace(/[−–—]/g,"-").replace(/,/g,"").replace(/°/g,"").toLowerCase();
  s=s.replace(/\s*(km|m|cm|mm|hours?|hrs?|minutes?|mins?|seconds?|secs?|goals?|shells?|books?|people|degrees?)\s*$/i,"").trim();
  if(!s)return NaN;
  let m=s.match(/^([+-]?\d+)\s+(\d+)\s*\/\s*(\d+)$/);
  if(m){const w=Number(m[1]),n=Number(m[2]),d=Number(m[3]);if(!d)return NaN;return w<0?w-n/d:w+n/d}
  m=s.match(/^([+-]?\d+(?:\.\d+)?)\s*\/\s*([+-]?\d+(?:\.\d+)?)$/);
  if(m){const d=Number(m[2]);if(!d)return NaN;return Number(m[1])/d}
  if(/^[+-]?\d+(?:\.\d+)?$/.test(s))return Number(s);
  return NaN;
}
function normalizeTextAnswer(value){
  return String(value||"")
    .toLowerCase()
    .replace(/[.,;:_\-]/g," ")
    .replace(/\bat\b/g," ")
    .replace(/\s+/g," ")
    .trim();
}

function isCorrectAnswer(u,c){
  const a=parseNumeric(u),b=parseNumeric(c);

  // Numeric, decimal, fraction and mixed-number answers.
  if(Number.isFinite(a)&&Number.isFinite(b)){
    return Math.abs(a-b)<1e-9;
  }

  const userText=normalizeTextAnswer(u);
  const correctText=normalizeTextAnswer(c);
  if(!userText)return false;

  // Exact text after harmless punctuation/spacing normalization.
  if(userText.replace(/\s+/g,"")===correctText.replace(/\s+/g,"")) return true;

  // Day + time answers: both parts are required, but order may vary.
  // Example: "Thursday 11am" and "11 am Thursday" are both accepted.
  const dayMatch=correctText.match(/\b(monday|tuesday|wednesday|thursday|friday|saturday|sunday)\b/);
  const timeMatch=correctText.match(/\b(\d{1,2})(?::(\d{2}))?\s*(am|pm)\b/);

  if(dayMatch&&timeMatch){
    const requiredDay=dayMatch[1];
    const requiredHour=String(Number(timeMatch[1]));
    const requiredMinute=timeMatch[2]||"";
    const requiredAmPm=timeMatch[3];

    const userDay=(userText.match(/\b(monday|tuesday|wednesday|thursday|friday|saturday|sunday)\b/)||[])[1];
    const userTime=userText.match(/\b(\d{1,2})(?::(\d{2}))?\s*(am|pm)\b/);

    if(!userDay||!userTime)return false;

    const userHour=String(Number(userTime[1]));
    const userMinute=userTime[2]||"";
    const userAmPm=userTime[3];

    return userDay===requiredDay &&
           userHour===requiredHour &&
           userMinute===requiredMinute &&
           userAmPm===requiredAmPm;
  }

  return false;
}
function formatDuration(ms){
  const t=Math.max(0,Math.floor(ms/1000)),m=Math.floor(t/60),s=t%60;
  return `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}
function getRawElapsedMs(){
  if(!quizStartTime)return 0;
  const end=quizEndTime?quizEndTime.getTime():(paused&&pauseStart?pauseStart:Date.now());
  return Math.max(0,end-quizStartTime.getTime()-totalPausedMs);
}
function getPenaltyMs(){return penaltyRuns*runSeconds*1000}
function getFinalScoreMs(){return getRawElapsedMs()+getPenaltyMs()}

function renderTimerBlock(){
  return `<div class="timer-controls">
    <div class="timer" id="rawTimer">Time: ${formatDuration(getRawElapsedMs())}</div>
    <div class="penalty-chip" id="runTimer">Run Penalty: ${penaltyRuns} × ${runSeconds}s</div>
    <div class="total-chip" id="totalTimer">Total: ${formatDuration(getFinalScoreMs())}</div>
    <button id="pauseBtn" class="pause-btn ${paused?"resume":""}">${paused?"Resume":"Pause"}</button>
  </div>`;
}
function updateTimers(){
  const a=document.getElementById("rawTimer"),b=document.getElementById("runTimer"),c=document.getElementById("totalTimer");
  if(a)a.textContent=`Time: ${formatDuration(getRawElapsedMs())}`;
  if(b)b.textContent=`Run Penalty: ${penaltyRuns} × ${runSeconds}s`;
  if(c)c.textContent=`Total: ${formatDuration(getFinalScoreMs())}`;
}
function startTimer(){stopTimer();timerId=setInterval(updateTimers,250)}
function stopTimer(){if(timerId)clearInterval(timerId);timerId=null}

function bindPause(){
  const btn=document.getElementById("pauseBtn");if(!btn)return;
  btn.onclick=()=>{
    if(!paused){
      paused=true;pauseStart=Date.now();
      if(questionStartTime!==null&&questionPauseStart===null)questionPauseStart=Date.now();
    }else{
      paused=false;totalPausedMs+=Date.now()-pauseStart;pauseStart=null;
      if(questionPauseStart!==null){questionPausedMs+=Date.now()-questionPauseStart;questionPauseStart=null}
    }
    renderQuestion();
  };
}
function startQuestionTimer(i){
  if(activeQuestionIndex===i&&questionStartTime!==null)return;
  if(activeQuestionIndex!==null)finishQuestionTimer(activeQuestionIndex);
  activeQuestionIndex=i;questionStartTime=Date.now();questionPauseStart=null;questionPausedMs=0;
}
function currentQuestionElapsedMs(){
  if(questionStartTime===null)return 0;
  const now=questionPauseStart!==null?questionPauseStart:Date.now();
  return Math.max(0,now-questionStartTime-questionPausedMs);
}
function finishQuestionTimer(i){
  if(activeQuestionIndex!==i||questionStartTime===null)return;
  questionStats[i].timeMs+=currentQuestionElapsedMs();
  activeQuestionIndex=null;questionStartTime=null;questionPauseStart=null;questionPausedMs=0;
}

function startQuiz(){
  questions=bankQuestions.map((q,i)=>({n:i+1,topic:q.topic||"",image:q.image,answer:bankAnswers[i]}));
  const n=questions.length;
  userAnswers=Array(n).fill("");solved=Array(n).fill(false);attempts=Array(n).fill(0);
  questionStats=Array(n).fill(null).map(()=>({wrong:0,timeMs:0}));
  currentQuestionIndex=0;unlocked=0;wrongAttempts=0;penaltyRuns=0;
  quizStartTime=new Date();quizEndTime=null;paused=false;pauseStart=null;totalPausedMs=0;
  activeQuestionIndex=null;questionStartTime=null;questionPauseStart=null;questionPausedMs=0;finalResults=null;
  document.getElementById("pageTitle").textContent=`Canta Math ${selectedSet.year} - ${selectedSet.label||normalizeGradeDisplay(selectedSet.grade)}`;
  renderQuestion();
}

function saveInput(){const input=document.getElementById("answerInput");if(input)userAnswers[currentQuestionIndex]=input.value}
function correctCount(){return solved.filter(Boolean).length}

function renderSidebar(){
  sidebarEl.style.display="block";
  sidebarEl.innerHTML=`<h4>Questions</h4><ul id="qList"></ul>`;
  const ul=document.getElementById("qList");

  for(let i=0;i<questions.length;i++){
    if(selectedMode==="run"&&i>unlocked&&!solved[i])continue;
    const li=document.createElement("li");li.textContent=`Q${i+1}`;li.dataset.index=i;
    if(i===currentQuestionIndex)li.classList.add("active");
    if(solved[i])li.classList.add("correct-li");else if(attempts[i]>0)li.classList.add("incorrect-li");

    if(selectedMode==="exercise"||i<=unlocked||solved[i]){
      li.onclick=()=>{
        if(paused)return;
        saveInput();finishQuestionTimer(currentQuestionIndex);currentQuestionIndex=i;renderQuestion();
      };
    }
    ul.appendChild(li);
  }
}

function nextUnsolved(after){
  for(let j=after+1;j<questions.length;j++)if(!solved[j])return j;
  if(selectedMode==="exercise"){
    for(let j=0;j<after;j++)if(!solved[j])return j;
  }
  return -1;
}

function renderQuestion(){
  if(correctCount()>=questions.length){finishQuiz();return}
  renderSidebar();

  const i=currentQuestionIndex,q=questions[i];
  if(!solved[i]&&!paused)startQuestionTimer(i);

  const nav=selectedMode==="exercise"
    ? `<button class="btn-prev" id="prevBtn" ${i===0||paused?"disabled":""}>Previous</button>
       <button class="btn-next" id="nextBtn" ${i===questions.length-1||paused?"disabled":""}>Next</button>`
    : `<span></span>`;

  quizContent.innerHTML=`
    <div class="quiz-topbar">
      <p class="question-text">${selectedMode==="run"?"Run Mode":"Exercise Mode"} - Question ${i+1} of ${questions.length}</p>
      ${renderTimerBlock()}
    </div>

    ${paused?'<div class="paused-cover">Paused. Click Resume to continue. The current question will stay here.</div>':
      `<div class="qbox"><img src="${q.image}" alt="Question ${i+1}" class="question-image"></div>`}

    <input id="answerInput" class="answer-box" type="text" value="${userAnswers[i]||""}"
      placeholder="Enter your answer" ${paused||solved[i]?"disabled":""}>

    <div id="checkResult">${solved[i]?"Correct.":""}</div>
    <div class="small-note">Every incorrect attempt adds 1 Run Penalty = ${runSeconds} seconds.</div>

    <div class="button-row">
      ${nav}
      <button class="btn-check" id="checkBtn" ${paused||solved[i]?"disabled":""}>Check Answer</button>
    </div>`;

  startTimer();bindPause();

  const input=document.getElementById("answerInput");
  if(input&&!input.disabled){
    setTimeout(()=>input.focus(),30);
    input.addEventListener("keydown",e=>{if(e.key==="Enter")document.getElementById("checkBtn").click()});
  }

  const prev=document.getElementById("prevBtn");
  if(prev)prev.onclick=()=>{saveInput();finishQuestionTimer(i);currentQuestionIndex--;renderQuestion()};
  const next=document.getElementById("nextBtn");
  if(next)next.onclick=()=>{saveInput();finishQuestionTimer(i);currentQuestionIndex++;renderQuestion()};

  document.getElementById("checkBtn").onclick=()=>{
    if(paused||solved[i])return;
    saveInput();
    const raw=(userAnswers[i]||"").trim(),result=document.getElementById("checkResult");
    if(!raw){result.textContent="Please enter an answer first.";result.style.color="#e65100";return}

    if(isCorrectAnswer(raw,q.answer)){
      finishQuestionTimer(i);solved[i]=true;result.textContent="Correct!";result.style.color="#2e7d32";
      if(selectedMode==="run")unlocked=Math.max(unlocked,i+1);
      const n=nextUnsolved(i);
      if(n>=0){currentQuestionIndex=n;if(selectedMode==="run")unlocked=Math.max(unlocked,n);setTimeout(renderQuestion,350)}
      else setTimeout(finishQuiz,350);
    }else{
      attempts[i]++;questionStats[i].wrong++;wrongAttempts++;penaltyRuns++;
      result.textContent=`Incorrect. +1 Run Penalty (+${runSeconds}s). Try again.`;
      result.style.color="#c62828";updateTimers();renderSidebar();input.select();input.focus();
    }
  };
}

function finishQuiz(){
  if(quizEndTime)return;
  finishQuestionTimer(currentQuestionIndex);quizEndTime=new Date();stopTimer();sidebarEl.style.display="none";

  finalResults=questions.map((q,i)=>({
    i,topic:q.topic,user:(userAnswers[i]||"").trim()||"—",answer:q.answer,
    result:solved[i]?"Correct":"Incomplete",wrong:questionStats[i].wrong,timeMs:questionStats[i].timeMs
  }));

  quizContent.innerHTML=`
    <h3>${selectedSet.year} ${selectedSet.label||normalizeGradeDisplay(selectedSet.grade)} - Results for ${studentName}</h3>
    <div class="summary-grid">
      <div class="summary-card"><div class="k">Mode</div><div class="v">${selectedMode.toUpperCase()}</div></div>
      <div class="summary-card"><div class="k">Correct</div><div class="v">${correctCount()} / ${questions.length}</div></div>
      <div class="summary-card"><div class="k">Actual Time</div><div class="v">${formatDuration(getRawElapsedMs())}</div></div>
      <div class="summary-card"><div class="k">Run Penalty</div><div class="v">${penaltyRuns} × ${runSeconds}s</div></div>
      <div class="summary-card"><div class="k">Final Score</div><div class="v">${formatDuration(getFinalScoreMs())}</div></div>
    </div>
    <p><strong>Penalty Time:</strong> ${formatDuration(getPenaltyMs())}<br>
       <strong>Wrong Attempts:</strong> ${wrongAttempts}<br>
       <strong>Formula:</strong> Final Score Time = Actual Time + Run Penalties × ${runSeconds} seconds</p>
    <table class="review-table">
      <tr><th>#</th><th>Knowledge Point</th><th>Your Answer</th><th>Correct Answer</th><th>Result</th><th>Run Penalties</th><th>Question Time</th></tr>
      ${finalResults.map(r=>`<tr class="${r.result==="Correct"?"correct-answer":"incorrect-answer"}">
        <td>Q${r.i+1}</td><td>${r.topic}</td><td>${r.user}</td><td>${r.answer}</td><td>${r.result}</td><td>${r.wrong}</td><td>${formatDuration(r.timeMs)}</td>
      </tr>`).join("")}
    </table>
    <div class="action-btns">
      <button id="saveResultBtn">Save Result as TXT</button>
      <button id="backBtn" style="background:#4caf50;">Back to Paper Selection</button>
    </div>`;

  document.getElementById("saveResultBtn").onclick=saveResultTxt;
  document.getElementById("backBtn").onclick=showStartScreen;
}

function saveResultTxt(){
  if(!finalResults)return;
  const lines=[
    `Student: ${studentName}`,
    `Paper: ${selectedSet.year} ${selectedSet.label||normalizeGradeDisplay(selectedSet.grade)}`,
    `Mode: ${selectedMode.toUpperCase()}`,
    `Actual Time: ${formatDuration(getRawElapsedMs())}`,
    `Penalty Runs: ${penaltyRuns}`,
    `Run Time: ${runSeconds} seconds`,
    `Penalty Time: ${formatDuration(getPenaltyMs())}`,
    `Final Score Time: ${formatDuration(getFinalScoreMs())}`,
    `Correct: ${correctCount()} / ${questions.length}`,
    `Wrong Attempts: ${wrongAttempts}`,
    "",
    "Q#, Knowledge Point, Your Answer, Correct Answer, Result, Run Penalties, Question Time"
  ];
  finalResults.forEach(r=>lines.push(`Q${r.i+1}, ${r.topic}, ${r.user}, ${r.answer}, ${r.result}, ${r.wrong}, ${formatDuration(r.timeMs)}`));
  const blob=new Blob([lines.join("\n")],{type:"text/plain;charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a");
  const safe=(studentName||"Student").replace(/[^a-z0-9_-]/gi,"_");
  a.href=url;a.download=`${safe}_${selectedSet.key}_${selectedMode}_result.txt`;
  document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
}

showStartScreen();
</script>
</body>
</html>
