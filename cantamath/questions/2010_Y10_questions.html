<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DYAA Canta Math 2010 Year 10 - Questions</title>
<style>
body{font-family:"Segoe UI",Tahoma,sans-serif;background:#f4f4f9;margin:0;padding:20px;color:#333}
.wrap{max-width:950px;margin:20px auto}
h1{color:#0d47a1}
.card{background:#fff;border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.08);padding:18px;margin:14px 0}
.qtitle{font-weight:900;margin-bottom:10px}
img{display:block;max-width:100%;max-height:650px;object-fit:contain;margin:auto}
.topic{color:#666;font-size:.9em;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
<h1>DYAA Canta Math 2010 Year 10 - Question Bank</h1>
<div id="list"></div>
</div>
<script src="2010_Y10_questions.js"></script>
<script>
const list=document.getElementById("list");
(window.CANTAMATH_2010_Y10_QUESTIONS||[]).forEach(q=>{
  const card=document.createElement("div");
  card.className="card";
  card.innerHTML=`<div class="qtitle">Question ${q.n}</div>
    <img src="${q.image}" alt="Question ${q.n}">
    <div class="topic">${q.topic||""}</div>`;
  list.appendChild(card);
});
</script>
</body>
</html>
