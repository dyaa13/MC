<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DYAA ICAS Mathematics</title>
<style>
:root{--blue:#0d47a1;--blue2:#1976d2;--orange:#ff9800;--green:#2e7d32;--red:#c62828;--purple:#7b1fa2;--bg:#f4f6f9;--line:#dfe4ea}
*{box-sizing:border-box} body{margin:0;background:var(--bg);font-family:"Segoe UI",Arial,sans-serif;color:#25313c;padding:18px}
.shell{max-width:1080px;margin:20px auto;background:white;border-radius:16px;box-shadow:0 8px 25px rgba(0,0,0,.09);padding:26px}
.header{display:flex;justify-content:space-between;gap:16px;align-items:center;border-bottom:3px solid var(--blue);padding-bottom:14px;margin-bottom:20px}
.brand{display:flex;gap:13px;align-items:center}.logo{width:56px;height:56px;border-radius:12px;background:linear-gradient(135deg,var(--blue) 0 62%,var(--orange) 62%);color:white;font-weight:900;display:grid;place-items:center}.brand-title{font-size:1.45rem;font-weight:900;color:var(--blue)}.brand-sub{font-size:.84rem;font-weight:800;letter-spacing:.8px;color:var(--orange);text-transform:uppercase;margin-top:3px}.tag{padding:8px 12px;border-radius:999px;background:#eaf3ff;color:var(--blue);font-weight:800;border:1px solid #cfe2ff;white-space:nowrap}
h1{font-size:1.75rem;margin:0 0 18px}.card{border:1px solid var(--line);background:#fbfcfd;border-radius:12px;padding:18px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid3{display:grid;grid-template-columns:1fr 1fr 1.35fr;gap:14px}.field label{display:block;font-weight:800;margin-bottom:6px}.field input,.field select{width:100%;padding:11px 12px;border:1px solid #cfd7df;border-radius:8px;font-size:1rem;background:white}.rule{margin:16px 0;padding:13px 14px;background:#fff8e1;border-left:4px solid var(--orange);border-radius:8px;line-height:1.55}.primary{border:0;background:var(--green);color:white;font-weight:800;border-radius:8px;padding:11px 20px;font-size:1rem;cursor:pointer}.secondary{border:0;background:#607d8b;color:white;font-weight:800;border-radius:8px;padding:10px 16px;font-size:.98rem;cursor:pointer}.blue{background:#0288d1}.purple{background:var(--purple)} button:disabled{opacity:.5;cursor:not-allowed}
.exam-layout{display:grid;grid-template-columns:190px 1fr;gap:20px}.navpanel{border-right:1px solid var(--line);padding-right:14px}.navpanel h3{font-size:.95rem;margin:0 0 10px}.qgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.qnav{border:1px solid #ccd5df;background:white;border-radius:7px;padding:7px 0;font-weight:800;cursor:pointer}.qnav.answered{background:#e8f5e9;border-color:#a5d6a7;color:#1b5e20}.qnav.active{background:#bbdefb;border-color:#64b5f6;color:#0d47a1}.topbar{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.progress{font-weight:900;color:var(--blue)}.timer{font-weight:900;padding:8px 11px;background:#f0f5ff;border:1px solid #ccdfff;border-radius:9px}.timer.warn{background:#fff3e0;border-color:#ffcc80;color:#e65100}.timer.danger{background:#ffebee;border-color:#ef9a9a;color:#b71c1c}.pause-btn{border:0;background:#ef6c00;color:white;font-weight:900;border-radius:9px;padding:9px 14px;cursor:pointer}.pause-screen{min-height:420px;display:flex;align-items:center;justify-content:center;text-align:center;border:1px solid var(--line);background:#fafafa;border-radius:12px;padding:30px}.pause-box{max-width:460px}.pause-box h2{color:var(--blue);font-size:2rem;margin:0 0 12px}.pause-box p{color:#5f6b75;line-height:1.55;margin:0 0 18px}.resume-btn{border:0;background:var(--green);color:white;font-weight:900;border-radius:9px;padding:12px 24px;font-size:1.05rem;cursor:pointer}.qcard{border:1px solid var(--line);background:#fafafa;border-radius:12px;padding:14px;min-height:300px;display:flex;align-items:flex-start;justify-content:center;overflow:auto}.qimg{display:block;width:min(100%,760px);height:auto;max-width:760px;object-fit:contain;cursor:default}.qimg.tall,.qimg.wide,.qimg.text,.qimg.graphic{max-width:760px}.qimg.small2005,.qimg.small2005.tall,.qimg.small2005.wide,.qimg.small2005.text,.qimg.small2005.graphic{max-width:480px}.qimg.small2018,.qimg.small2018.tall,.qimg.small2018.wide,.qimg.small2018.text,.qimg.small2018.graphic{max-width:340px}.answer-area{margin-top:14px;border-top:1px solid var(--line);padding-top:14px}.mcq-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:10px}.choice{border:2px solid #d7dee6;background:white;border-radius:10px;padding:11px;font-size:1.05rem;font-weight:900;cursor:pointer}.choice.selected{background:#e3f2fd;border-color:#42a5f5;color:#0d47a1}.text-answer{width:100%;max-width:380px;padding:11px 12px;font-size:1.05rem;border:1px solid #bfc9d4;border-radius:8px}.buttons{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:18px}.left-buttons,.right-buttons{display:flex;gap:10px;flex-wrap:wrap}.hint{font-size:.9rem;color:#687580;margin-top:8px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}.sum{border:1px solid var(--line);background:#fafafa;border-radius:10px;padding:12px}.sum .k{text-transform:uppercase;color:#6f7a84;font-size:.75rem;font-weight:800}.sum .v{font-size:1.3rem;font-weight:900;color:var(--blue);margin-top:4px}.result-box{border-radius:10px;padding:14px;line-height:1.6}.good{background:#edf7ee;border:1px solid #c8e6c9}.bad{background:#fff4f4;border:1px solid #ffcdd2}.sheet-status{margin-top:14px;padding:11px 12px;border-radius:8px;background:#f5f7fa;border:1px solid var(--line);font-weight:700}.wrong-list{font-weight:900;color:var(--red)}
@media(max-width:780px){.qimg,.qimg.tall,.qimg.wide,.qimg.text,.qimg.graphic{width:100%;max-width:100%;height:auto}body{padding:8px}.shell{margin:8px auto;padding:15px}.tag{display:none}.grid2,.grid3{grid-template-columns:1fr}.exam-layout{grid-template-columns:1fr}.navpanel{border-right:0;border-bottom:1px solid var(--line);padding-right:0;padding-bottom:12px}.qgrid{grid-template-columns:repeat(8,1fr)}.summary{grid-template-columns:1fr 1fr}.mcq-row{grid-template-columns:1fr 1fr}.qcard{min-height:360px}}
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <div class="brand"><div class="logo">DYAA</div><div><div class="brand-title">DYAA Education NZ</div><div class="brand-sub">ICAS Mathematics</div></div></div>
    <div class="tag">One Question at a Time • Final Template</div>
  </div>
  <h1 id="pageTitle">ICAS Mathematics Test</h1>
  <div id="app"></div>
</div>
<iframe name="sheetSink" style="display:none"></iframe>
<script src="catalog.js"></script>
<script src="config.js"></script>
<script>
const CATALOG=window.ICAS_CATALOG||[];
const CONFIG=window.DYAA_ICAS_CONFIG||{};
const app=document.getElementById('app');
const pageTitle=document.getElementById('pageTitle');
let paper=null,questions=[],answers=[],studentName='';
let current=0,userAnswers=[],startMs=0,endMs=0,timerId=null,submitted=false,autoSubmitted=false;
let paused=false,pauseStartedMs=0,totalPausedMs=0;
let autoSubmitReason='',leaveSubmitSent=false;
const FORCE_SUBMIT_MIN_SECONDS=10*60;
let loaded=new Set();

function loadScript(src){return new Promise((resolve,reject)=>{if(loaded.has(src))return resolve();const s=document.createElement('script');s.src=src;s.onload=()=>{loaded.add(src);resolve()};s.onerror=()=>reject(new Error('Could not load '+src));document.head.appendChild(s)})}
function esc(s){return String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmt(sec){sec=Math.max(0,Math.floor(sec));const m=Math.floor(sec/60),s=sec%60;return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
function normalized(v){v=String(v??'').trim().toUpperCase();if(/^\d+$/.test(v)) return String(parseInt(v,10));return v.replace(/\s+/g,' ')}
function isAnswered(i){return normalized(userAnswers[i])!==''}
function timeLimitSec(){return (paper?.timeLimitMinutes||45)*60}
function elapsedSec(){if(!startMs)return 0;const effectiveNow=endMs||((paused&&pauseStartedMs)?pauseStartedMs:Date.now());return Math.min(timeLimitSec(),Math.floor((effectiveNow-startMs-totalPausedMs)/1000))}
function remainingSec(){return Math.max(0,timeLimitSec()-elapsedSec())}

function availableYears(){return [...new Set(CATALOG.map(p=>Number(p.year)))].sort((a,b)=>b-a)}
function availableGrades(){return [...new Set(CATALOG.map(p=>String(p.paper)))].sort((a,b)=>String(a).localeCompare(String(b)))}
function papersForYear(year){return CATALOG.filter(p=>Number(p.year)===Number(year)).sort((a,b)=>String(a.paper).localeCompare(String(b.paper)))}
function yearsForGrade(grade){return CATALOG.filter(p=>String(p.paper)===String(grade)).map(p=>Number(p.year)).filter((v,i,a)=>a.indexOf(v)===i).sort((a,b)=>b-a)}
function fillYearOptions(){
  const gradeSel=document.getElementById('gradeSelect'),yearSel=document.getElementById('yearSelect');
  if(!gradeSel||!yearSel)return;
  const years=yearsForGrade(gradeSel.value);
  yearSel.innerHTML=years.map(y=>`<option value="${y}">${y}</option>`).join('');
}
function showStart(){clearInterval(timerId);submitted=false;autoSubmitted=false;paused=false;pauseStartedMs=0;totalPausedMs=0;pageTitle.textContent='ICAS Mathematics Test';
  if(!CATALOG.length){app.innerHTML='<div class="card">No papers found in catalog.js.</div>';return}
  const grades=availableGrades();
  const gradeOptions=grades.map(g=>`<option value="${esc(g)}">Grade ${esc(g)}</option>`).join('');
  app.innerHTML=`<div class="card">
    <div class="grid3">
      <div class="field"><label>Grade</label><select id="gradeSelect">${gradeOptions}</select></div>
      <div class="field"><label>Year</label><select id="yearSelect"></select></div>
      <div class="field"><label>Student Name</label><input id="studentName" placeholder="Enter student name"></div>
    </div>
    <div class="rule"><strong>Exam format:</strong> one question at a time, one overall timer, and no answer checking during the test. Use <strong>Pause</strong> to stop the timer temporarily without changing questions.<br>At the end, press <strong>Submit Test</strong> to calculate the overall score. The result includes the wrong question numbers and can be sent to the Google Sheet tab <strong>${esc(CONFIG.resultSheetName||'ICAS')}</strong>.</div>
    <button class="primary" id="startBtn">Start Test</button>
  </div>`;
  document.getElementById('gradeSelect').onchange=fillYearOptions;
  fillYearOptions();
  document.getElementById('startBtn').onclick=startTest;
}

async function startTest(){
  const year=Number(document.getElementById('yearSelect').value);
  const grade=document.getElementById('gradeSelect').value;
  paper=CATALOG.find(p=>Number(p.year)===year&&String(p.paper)===grade);
  studentName=(document.getElementById('studentName').value||'Student').trim()||'Student';
  if(!paper){app.innerHTML='<div class="card bad">The selected Year and Grade could not be found.</div>';return}
  try{await loadScript(paper.questionScript);await loadScript(paper.answerScript)}catch(e){app.innerHTML=`<div class="card bad">${esc(e.message)}</div>`;return}
  questions=window[paper.questionGlobal]||[];answers=window[paper.answerGlobal]||[];
  if(!questions.length||answers.length!==questions.length){app.innerHTML='<div class="card bad">Question/answer data is incomplete.</div>';return}
  current=0;userAnswers=Array(questions.length).fill('');startMs=Date.now();endMs=0;submitted=false;autoSubmitted=false;autoSubmitReason='';leaveSubmitSent=false;paused=false;pauseStartedMs=0;totalPausedMs=0;pageTitle.textContent=paper.label;renderExam();timerId=setInterval(updateTimer,500);
}

function updateTimer(){
  const el=document.getElementById('timer');if(!el)return;const r=remainingSec();el.textContent=paused?`Paused • ${fmt(r)} remaining`:`Time Remaining ${fmt(r)}`;el.className='timer'+(r<=300?' danger':r<=600?' warn':'');
  const forceReady=!paused&&!submitted&&elapsedSec()>=FORCE_SUBMIT_MIN_SECONDS;
  const notice=document.getElementById('forceSubmitNotice');
  if(notice){notice.style.display=forceReady?'block':'none';if(forceReady)notice.textContent='After 10 minutes, leaving, refreshing or closing this test will automatically submit your current answers — even if some questions are unanswered.';}
  const submitBtn=document.getElementById('submitBtn');if(submitBtn&&forceReady)submitBtn.style.display='inline-block';
  if(!paused&&r<=0&&!submitted){autoSubmitted=true;autoSubmitReason='time_limit';submitTest(true)}
}
function renderNav(){return `<div class="navpanel"><h3>Questions</h3><div class="qgrid">${questions.map((q,i)=>`<button class="qnav ${isAnswered(i)?'answered':''} ${i===current?'active':''}" data-i="${i}">${i+1}</button>`).join('')}</div><div class="hint" style="margin-top:10px">Green = answered</div></div>`}

function questionImageClass(){ return ""; }

function answerControls(){const q=questions[current],v=userAnswers[current]||'';if(q.type==='mcq'){const opts=q.choices||['A','B','C','D'];return `<div class="mcq-row">${opts.map(c=>`<button class="choice ${v===c?'selected':''}" data-choice="${c}">${c}</button>`).join('')}</div><div class="hint">Choose ${opts.join(', ')} in the same order the options appear in the original question (left-to-right, then top-to-bottom where needed). Your answer is saved automatically.</div>`;}const hint=q.hint||'Type your answer.';return `<input id="textAnswer" class="text-answer" inputmode="text" autocomplete="off" value="${esc(v)}" placeholder="Enter your answer"><div class="hint">${esc(hint)} Your answer is saved automatically.</div>`}
function pauseTest(){
  if(paused||submitted)return;
  const txt=document.getElementById('textAnswer');if(txt)userAnswers[current]=txt.value;
  paused=true;pauseStartedMs=Date.now();renderPaused();
}
function resumeTest(){
  if(!paused||submitted)return;
  totalPausedMs+=Date.now()-pauseStartedMs;pauseStartedMs=0;paused=false;renderExam();
}
function renderPaused(){
  app.innerHTML=`<div class="topbar"><div class="progress">${esc(paper.label)}</div><div id="timer" class="timer"></div></div><div class="pause-screen"><div class="pause-box"><h2>Test Paused</h2><p>The overall timer is stopped while the test is paused. Your current answer and question position have been kept.</p><button id="resumeBtn" class="resume-btn">Resume Test</button></div></div>`;
  document.getElementById('resumeBtn').onclick=resumeTest;updateTimer();
}

function renderExam(){
  const forceReady=elapsedSec()>=FORCE_SUBMIT_MIN_SECONDS;
  app.innerHTML=`<div class="exam-layout">${renderNav()}<main><div class="topbar"><div class="progress">Question ${current+1} of ${questions.length}</div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button id="pauseBtn" class="pause-btn">Pause</button><div id="timer" class="timer"></div></div></div><div id="forceSubmitNotice" class="rule" style="display:${forceReady?'block':'none'};margin:0 0 12px">After 10 minutes, leaving, refreshing or closing this test will automatically submit your current answers — even if some questions are unanswered.</div><div class="qcard"><img id="questionImage" class="qimg" src="${esc(questions[current].image)}" alt="Question ${current+1}"></div><div class="answer-area">${answerControls()}</div><div class="buttons"><div class="left-buttons"><button class="secondary blue" id="prevBtn" ${current===0?'disabled':''}>Previous</button><button class="secondary" id="nextBtn" ${current===questions.length-1?'disabled':''}>Next</button></div><div class="right-buttons"><button class="secondary purple" id="submitBtn" style="display:${(current===questions.length-1||forceReady)?'inline-block':'none'}">Submit Test</button></div></div></main></div>`;
  document.querySelectorAll('.qnav').forEach(b=>b.onclick=()=>goTo(Number(b.dataset.i)));
  document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{userAnswers[current]=b.dataset.choice;renderExam();updateTimer()});
  const txt=document.getElementById('textAnswer');if(txt){txt.oninput=()=>userAnswers[current]=txt.value;setTimeout(()=>txt.focus(),0)}
  document.getElementById('prevBtn').onclick=()=>goTo(current-1);document.getElementById('nextBtn').onclick=()=>goTo(current+1);document.getElementById('pauseBtn').onclick=pauseTest;const submitBtn=document.getElementById('submitBtn');if(submitBtn)submitBtn.onclick=()=>submitTest(false);const qi=document.getElementById('questionImage');if(qi){const applySizing=()=>{const r=qi.naturalWidth && qi.naturalHeight ? qi.naturalWidth/qi.naturalHeight : 1; qi.classList.remove('tall','wide','text','graphic','small2005','small2018'); if(r<0.85){qi.classList.add('tall');} else if(r>1.35){qi.classList.add('wide');} else {qi.classList.add('text');} if(paper && paper.key==='2005_C'){qi.classList.add('small2005');} if(paper && paper.key==='2018_E'){qi.classList.add('small2018');}}; if(qi.complete){applySizing();} else {qi.addEventListener('load',applySizing,{once:true});}}updateTimer();
}
function goTo(i){if(i<0||i>=questions.length)return;const txt=document.getElementById('textAnswer');if(txt)userAnswers[current]=txt.value;current=i;renderExam()}
function answerMatches(user,answer){const u=normalized(user);if(Array.isArray(answer))return answer.some(a=>u===normalized(a));return u===normalized(answer)}
function scoreResult(){let correct=0,wrong=[],unanswered=[];for(let i=0;i<questions.length;i++){const u=normalized(userAnswers[i]);if(!u){unanswered.push(i+1);continue}if(answerMatches(userAnswers[i],answers[i]))correct++;else wrong.push(i+1)}return{correct,wrong,unanswered}}
function submitTest(fromTimer){if(submitted)return;if(paused)return;const txt=document.getElementById('textAnswer');if(txt)userAnswers[current]=txt.value;if(!fromTimer){const unanswered=userAnswers.filter(v=>normalized(v)==='').length;const msg=unanswered?`You still have ${unanswered} unanswered question(s). Submit anyway?`:'Submit the test now?';if(!confirm(msg))return;autoSubmitReason='manual'}submitted=true;endMs=Date.now();clearInterval(timerId);showResult()}
function showResult(){const r=scoreResult(),pct=Math.round(r.correct/questions.length*1000)/10,timeUsed=elapsedSec();const wrongText=r.wrong.length?r.wrong.join(', '):'None';const unansweredText=r.unanswered.length?r.unanswered.join(', '):'None';pageTitle.textContent='ICAS Test Result';
  app.innerHTML=`<h2>${esc(paper.label)} - ${esc(studentName)}</h2><div class="summary"><div class="sum"><div class="k">Score</div><div class="v">${r.correct} / ${questions.length}</div></div><div class="sum"><div class="k">Percentage</div><div class="v">${pct}%</div></div><div class="sum"><div class="k">Time Used</div><div class="v">${fmt(timeUsed)}</div></div><div class="sum"><div class="k">Time Limit</div><div class="v">${paper.timeLimitMinutes} min</div></div></div>
  <div class="result-box ${r.wrong.length?'bad':'good'}"><strong>Wrong question numbers:</strong> <span class="wrong-list">${wrongText}</span><br><strong>Unanswered:</strong> ${unansweredText}${autoSubmitted?`<br><strong>The test was submitted automatically${autoSubmitReason==='time_limit'?' because time expired.':'.'}</strong>`:''}</div>
  <div id="sheetStatus" class="sheet-status">Preparing Google Sheet result...</div><div class="buttons"><div class="left-buttons"><button class="secondary" id="downloadBtn">Download Result</button></div><div class="right-buttons"><button class="primary" id="restartBtn">Back to Start</button></div></div>`;
  document.getElementById('restartBtn').onclick=showStart;document.getElementById('downloadBtn').onclick=()=>downloadResult(r,pct,timeUsed);sendToSheet(r,pct,timeUsed);
}
function payloadFor(r,pct,timeUsed){return{studentName,competition:'ICAS Mathematics',resultSheetName:CONFIG.resultSheetName||'ICAS',year:paper.year,paper:paper.paper,paperKey:paper.key,score:r.correct,total:questions.length,percentage:pct,timeUsed:fmt(timeUsed),timeUsedSeconds:timeUsed,wrongQuestions:r.wrong.join(', '),unansweredQuestions:r.unanswered.join(', '),submittedAnswers:userAnswers.map((v,i)=>`Q${i+1}:${normalized(v)||'-'}`).join(' | '),autoSubmitted,autoSubmitReason,submittedAt:new Date().toISOString()}}
function sendToSheet(r,pct,timeUsed){const status=document.getElementById('sheetStatus'),url=(CONFIG.googleAppsScriptUrl||'').trim();if(!url){status.innerHTML='Google Sheet is <strong>not connected yet</strong>. Paste the deployed Apps Script Web App URL into <code>config.js</code>. The test result is still shown above.';return}
  try{const form=document.createElement('form');form.method='POST';form.action=url;form.target='sheetSink';form.style.display='none';const input=document.createElement('input');input.type='hidden';input.name='payload';input.value=JSON.stringify(payloadFor(r,pct,timeUsed));form.appendChild(input);document.body.appendChild(form);form.submit();setTimeout(()=>form.remove(),1500);status.innerHTML=`Result submission sent to Google Sheet tab <strong>${esc(CONFIG.resultSheetName||'ICAS')}</strong>. Please check the sheet to confirm the row was added.`;}
  catch(e){status.textContent='Could not send result to Google Sheet: '+e.message}}
function downloadResult(r,pct,timeUsed){const lines=[`Student: ${studentName}`,`Paper: ${paper.label}`,`Score: ${r.correct}/${questions.length}`,`Percentage: ${pct}%`,`Time Used: ${fmt(timeUsed)}`,`Wrong Questions: ${r.wrong.join(', ')||'None'}`,`Unanswered: ${r.unanswered.join(', ')||'None'}`];const blob=new Blob([lines.join('\n')],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${studentName.replace(/[^a-z0-9_-]+/gi,'_')}_${paper.key}_result.txt`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}


function autoSubmitOnLeave(){
  if(!paper||submitted||leaveSubmitSent||elapsedSec()<FORCE_SUBMIT_MIN_SECONDS)return;
  const txt=document.getElementById('textAnswer');if(txt)userAnswers[current]=txt.value;
  leaveSubmitSent=true;autoSubmitted=true;autoSubmitReason='left_after_10_minutes';endMs=Date.now();
  const r=scoreResult(),pct=Math.round(r.correct/questions.length*1000)/10,timeUsed=elapsedSec();
  const url=(CONFIG.googleAppsScriptUrl||'').trim();if(!url)return;
  const data=new URLSearchParams();data.append('payload',JSON.stringify(payloadFor(r,pct,timeUsed)));
  try{if(navigator.sendBeacon&&navigator.sendBeacon(url,data))return;}catch(e){}
  try{fetch(url,{method:'POST',body:data,keepalive:true,mode:'no-cors'});}catch(e){}
}
window.addEventListener('beforeunload',e=>{if(paper&&!submitted&&elapsedSec()>=FORCE_SUBMIT_MIN_SECONDS){e.preventDefault();e.returnValue='';}});
window.addEventListener('pagehide',()=>{autoSubmitOnLeave();});

document.addEventListener('keydown',e=>{if(!paper||submitted||paused)return;const q=questions[current],opts=q?.choices||['A','B','C','D'];if(q?.type==='mcq'&&opts.includes(e.key.toUpperCase())){userAnswers[current]=e.key.toUpperCase();renderExam();updateTimer()}else if(e.key==='ArrowRight'&&current<questions.length-1)goTo(current+1);else if(e.key==='ArrowLeft'&&current>0)goTo(current-1)});
showStart();
</script>
</body>
</html>
